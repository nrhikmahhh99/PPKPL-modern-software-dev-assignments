<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHP Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-6xl mx-auto">
      <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-2">
          Task Management (PHP)
        </h1>
        <p class="text-gray-500 text-lg">Vanilla PHP + JSON File + Tailwind</p>
      </header>

      <div
        class="bg-white p-6 rounded-2xl shadow-sm mb-12 flex flex-col md:flex-row gap-4 items-end border border-gray-200"
      >
        <div class="flex-1 w-full text-left">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Task Title*</label
          >
          <input
            type="text"
            id="title"
            placeholder="What needs to be done?"
            class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div class="flex-[2] w-full text-left">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Description</label
          >
          <input
            type="text"
            id="description"
            placeholder="Add details..."
            class="w-full p-2 border border-gray-300 rounded-lg outline-none"
          />
        </div>
        <button
          onclick="addTask()"
          class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition w-full md:w-auto"
        >
          Add Task
        </button>
      </div>

      <div class="flex flex-wrap gap-6">
        <div
          class="flex-1 min-w-[300px] bg-gray-50 p-4 rounded-xl shadow-inner"
        >
          <h2
            class="text-lg font-bold mb-4 uppercase tracking-wider text-gray-600"
          >
            🎯 To Do
          </h2>
          <div id="col-todo" class="space-y-3"></div>
        </div>
        <div
          class="flex-1 min-w-[300px] bg-gray-50 p-4 rounded-xl shadow-inner"
        >
          <h2
            class="text-lg font-bold mb-4 uppercase tracking-wider text-blue-600"
          >
            ⚡ In Progress
          </h2>
          <div id="col-in-progress" class="space-y-3"></div>
        </div>
        <div
          class="flex-1 min-w-[300px] bg-gray-50 p-4 rounded-xl shadow-inner"
        >
          <h2
            class="text-lg font-bold mb-4 uppercase tracking-wider text-green-600"
          >
            ✅ Done
          </h2>
          <div id="col-done" class="space-y-3"></div>
        </div>
      </div>
    </div>

    <script>
      async function fetchTasks() {
        const res = await fetch("api.php");
        const tasks = await res.json();

        document.getElementById("col-todo").innerHTML = "";
        document.getElementById("col-in-progress").innerHTML = "";
        document.getElementById("col-done").innerHTML = "";

        tasks.forEach((task) => {
          const taskCard = `
                    <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-blue-500 hover:shadow-lg transition">
                        <h3 class="font-semibold text-gray-800">${task.title}</h3>
                        <p class="text-sm text-gray-600 mb-3">${task.description}</p>
                        <div class="flex justify-between items-center mt-2">
                            <select onchange="updateStatus(${task.id}, this.value)" class="text-xs bg-gray-100 border rounded p-1">
                                <option value="todo" ${task.status === "todo" ? "selected" : ""}>To Do</option>
                                <option value="in progress" ${task.status === "in progress" ? "selected" : ""}>In Progress</option>
                                <option value="done" ${task.status === "done" ? "selected" : ""}>Done</option>
                            </select>
                            <button onclick="deleteTask(${task.id})" class="text-red-500 hover:text-red-700 text-sm font-medium">Delete</button>
                        </div>
                    </div>
                `;

          if (task.status === "todo")
            document.getElementById("col-todo").innerHTML += taskCard;
          else if (task.status === "in progress")
            document.getElementById("col-in-progress").innerHTML += taskCard;
          else if (task.status === "done")
            document.getElementById("col-done").innerHTML += taskCard;
        });
      }

      async function addTask() {
        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;
        if (!title) return alert("Title cannot be empty!");

        await fetch("api.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, description }),
        });

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        fetchTasks();
      }

      async function updateStatus(id, newStatus) {
        await fetch(`api.php?id=${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
        });
        fetchTasks();
      }

      async function deleteTask(id) {
        await fetch(`api.php?id=${id}`, { method: "DELETE" });
        fetchTasks();
      }

      fetchTasks();
    </script>
  </body>
</html>
